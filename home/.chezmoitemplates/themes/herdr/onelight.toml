# One Light is a herdr built-in; only the sidebar surfaces are shaped (Atom's panel background under the sidebar, tab bar and popups, two gray steps for the active row and the navigate cursor).
name = "one-light"

[theme.custom]
accent = "#789ff4"        # #4078f2 blended 70/30 with the background: softer pane frames, same hue
sidebar_bg = "#f0f0f1"
panel_bg = "#f0f0f1"
active_row_bg = "#e5e5e6"
selection_bg = "#dbdbdc"
