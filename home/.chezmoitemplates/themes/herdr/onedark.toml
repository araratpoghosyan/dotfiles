# One Dark is a herdr built-in; only the sidebar surfaces are shaped (Atom's darker background under the sidebar, tab bar and popups, the visual-selection shade for the active row, the gutter shade for the navigate cursor).
name = "one-dark"

[theme.custom]
accent = "#5088b7"        # #61afef blended 70/30 with the background: softer pane frames, same hue
sidebar_bg = "#21252b"
panel_bg = "#21252b"
active_row_bg = "#3e4452"
selection_bg = "#4b5263"
