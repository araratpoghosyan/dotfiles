# Dracula is a herdr built-in. The sidebar, tab bar and popups
# sit on the spec's darker background, the active row on the current-line color, the navigate
# cursor on the comment color (the row highlight lazygit uses too). The accent is softened for
# the pane frames.
name = "dracula"

[theme.custom]
accent = "#9074be"        # #bd93f9 blended 70/30 with the background: softer pane frames, same hue
sidebar_bg = "#21222c"    # background, darker
panel_bg = "#21222c"      # background, darker
active_row_bg = "#44475a" # current line
selection_bg = "#6272a4"  # comment
