# Nord is a herdr built-in. Following Nord's own guidance the
# sidebar, tab bar and popups sit on nord1 (elevated panels), the active row on nord2, the
# navigate cursor on nord3. The accent is softened for the pane frames.
name = "nord"

[theme.custom]
accent = "#6d96a5"        # #88c0d0 blended 70/30 with the background: softer pane frames, same hue
sidebar_bg = "#3b4252"    # nord1
panel_bg = "#3b4252"      # nord1
active_row_bg = "#434c5e" # nord2
selection_bg = "#4c566a"  # nord3
