# TokyoNight Day is a herdr built-in. The sidebar, tab bar and
# popups sit on bg_dark (Day's lighter chrome shade), the active row on bg_highlight, the navigate
# cursor on bg_visual. The accent is softened for the pane frames.
name = "tokyo-night-day"

[theme.custom]
accent = "#649be8"        # #2e7de9 blended 70/30 with the background: softer pane frames, same hue
sidebar_bg = "#e9e9ec"    # bg_dark
panel_bg = "#e9e9ec"      # bg_dark
active_row_bg = "#c4c8da" # bg_highlight
selection_bg = "#b6bfe2"  # bg_visual
