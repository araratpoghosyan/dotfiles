# Catppuccin Mocha is herdr's built-in base. The sidebar sits on mantle like the tab bar and
# popups; the active row is surface0 and the navigate cursor surface1, because herdr's own active row is Mocha
# base, the very color ghostty shows, so it vanished. The accent is softened for the pane frames.
name = "catppuccin"

[theme.custom]
accent = "#6987bd"        # #89b4fa blended 70/30 with the background: softer pane frames, same hue
sidebar_bg = "#181825"    # mantle
active_row_bg = "#313244" # surface0
selection_bg = "#45475a"  # surface1
