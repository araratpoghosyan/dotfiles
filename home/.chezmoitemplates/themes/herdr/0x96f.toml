# 0x96f is not a herdr built-in and herdr accepts only built-in names here. `terminal` makes every
# color token follow the host terminal's ANSI palette, which ghostty already renders in 0x96f.
# Deliberately no [theme.custom] block: herdr layers that table over whichever theme is picked in
# its Settings screen, so overriding every token made every in-app pick invisible.
name = "terminal"
