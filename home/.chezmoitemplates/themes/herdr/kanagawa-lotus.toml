# Kanagawa Lotus is a herdr built-in; only the sidebar surfaces are shaped (lotusWhite0 under the sidebar, tab bar and popups, lotusWhite4 for the active row, lotusWhite5 for the navigate cursor).
name = "kanagawa-lotus"

[theme.custom]
accent = "#7e90a5"        # #4d699b blended 70/30 with the background: softer pane frames, same hue
sidebar_bg = "#d5cea3"
panel_bg = "#d5cea3"
active_row_bg = "#e7dba0"
selection_bg = "#e4d794"
