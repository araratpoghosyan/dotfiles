# Where each themed tool keeps its per-theme asset. %s is the theme name.
#
#   source  path in the chezmoi source directory; read by the coverage assertion and by
#           cache-rebuild hashes
#   target  path in $HOME; only for tools that read the theme file themselves. Drives
#           .chezmoiignore (deploy only the active theme) and the prune script (remove the
#           previous theme's files after a switch)
#
# Path convention across the tree: shell scripts use $HOME at run time; formats with no variable
# expansion (plist, JSON, TOML) use {{ .chezmoi.homeDir }} at render time.
#
# Tools without a target (eza, fzf, herdr, lazygit) get the theme merged into their main config at
# render time, so their assets are template inputs under .chezmoitemplates/themes/ and never
# reach $HOME on their own.
themeAssets:
  bat:
    source: dot_config/bat/themes/%s.tmTheme
    target: .config/bat/themes/%s.tmTheme
  btop:
    source: dot_config/btop/themes/%s.theme
    target: .config/btop/themes/%s.theme
  opencode:
    source: dot_config/opencode/themes/%s.json
    target: .config/opencode/themes/%s.json
  yazi:
    source: dot_config/yazi/flavors/%s.yazi/flavor.toml
    target: .config/yazi/flavors/%s.yazi
  eza:
    source: .chezmoitemplates/themes/eza/%s.yaml
  fzf:
    source: .chezmoitemplates/themes/fzf/%s.fzfrc
  herdr:
    source: .chezmoitemplates/themes/herdr/%s.toml
  lazygit:
    source: .chezmoitemplates/themes/lazygit/%s.yaml
