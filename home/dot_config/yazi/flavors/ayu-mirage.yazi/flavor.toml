# ayu mirage for yazi, built from the official palette: https://github.com/ayu-theme/ayu-colors (MIT).
# : Manager {{{

[mgr]
cwd = { fg = "#5ccfe6" }

hovered = { reversed = true }
preview_hovered = { underline = true }

find_keyword = { fg = "#ffcc66", bold = true, italic = true, underline = true }
find_position = { fg = "#dfbfff", bg = "reset", bold = true, italic = true }

marker_copied = { fg = "#d5ff80", bg = "#d5ff80" }
marker_cut = { fg = "#f28779", bg = "#f28779" }
marker_marked = { fg = "#5ccfe6", bg = "#5ccfe6" }
marker_selected = { fg = "#ffcc66", bg = "#ffcc66" }

tab_active = { reversed = true }
tab_inactive = { fg = "#6c7a8b" }
tab_width = 1

count_copied = { fg = "#1f2430", bg = "#d5ff80" }
count_cut = { fg = "#1f2430", bg = "#f28779" }
count_selected = { fg = "#1f2430", bg = "#ffcc66" }

border_symbol = "│"
border_style = { fg = "#171b24" }

# : }}}


# : Tabs {{{

[tabs]
active = { fg = "#1f2430", bg = "#ffcc66", bold = true }
inactive = { fg = "#ffcc66", bg = "#1c212b" }

# : }}}


# : Mode {{{

[mode]
normal_main = { fg = "#1f2430", bg = "#ffcc66", bold = true }
normal_alt = { fg = "#ffcc66", bg = "#1c212b" }

select_main = { fg = "#1f2430", bg = "#d5ff80", bold = true }
select_alt = { fg = "#d5ff80", bg = "#1c212b" }

unset_main = { fg = "#1f2430", bg = "#f28779", bold = true }
unset_alt = { fg = "#f28779", bg = "#1c212b" }

# : }}}


# : Status bar {{{

[status]
perm_sep = { fg = "#6c7a8b" }
perm_type = { fg = "#73d0ff" }
perm_read = { fg = "#ffcc66" }
perm_write = { fg = "#f28779" }
perm_exec = { fg = "#d5ff80" }

progress_label = { fg = "#cccac2", bold = true }
progress_normal = { fg = "#73d0ff", bg = "#274364" }
progress_error = { fg = "#f28779", bg = "#274364" }

# : }}}


# : Pick {{{

[pick]
border = { fg = "#73d0ff" }
active = { fg = "#dfbfff", bold = true }
inactive = { fg = "#cccac2" }

# : }}}


# : Input {{{

[input]
border = { fg = "#73d0ff" }
title = { fg = "#cccac2" }
value = { fg = "#cccac2" }
selected = { reversed = true }

# : }}}


# : Completion {{{

[cmp]
border = { fg = "#73d0ff" }

# : }}}


# : Tasks {{{

[tasks]
border = { fg = "#73d0ff" }
title = { fg = "#cccac2" }
hovered = { fg = "#dfbfff", underline = true }

# : }}}


# : Which {{{

[which]
mask = { bg = "#1c212b" }
cand = { fg = "#5ccfe6" }
rest = { fg = "#6c7a8b" }
desc = { fg = "#dfbfff" }
separator = "  "
separator_style = { fg = "#171b24" }

# : }}}


# : Help {{{

[help]
on = { fg = "#5ccfe6" }
run = { fg = "#dfbfff" }
hovered = { reversed = true, bold = true }
footer = { fg = "#1f2430", bg = "#cccac2" }

# : }}}


# : Notify {{{

[notify]
title_info = { fg = "#d5ff80" }
title_warn = { fg = "#ffcc66" }
title_error = { fg = "#f28779" }

# : }}}


# : File-specific styles {{{

[filetype]

rules = [
  { mime = "image/*", fg = "#5ccfe6" },
  { mime = "{audio,video}/*", fg = "#ffcc66" },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#dfbfff" },
  { mime = "application/{pdf,doc,rtf,odt,docx,xlsx,pptx}", fg = "#d5ff80" },
  { name = "*", fg = "#cccac2" },
  { name = "*/", fg = "#73d0ff", bold = true },
]

# : }}}
