# oh-my-zsh: cloned once by chezmoi, then updated by oh-my-zsh itself (`omz update` and its
# periodic prompt, see `zstyle ':omz:update'` in .zshrc). No refreshPeriod on purpose: chezmoi must
# never pull here or the two updaters would fight. Shallow clone, like oh-my-zsh's own installer.
# Custom plugins live in ~/.config/oh-my-zsh (ZSH_CUSTOM), never inside this clone.
[".oh-my-zsh"]
    type = "git-repo"
    url = "https://github.com/ohmyzsh/ohmyzsh.git"
    clone.args = ["--depth=1"]

# ZSH Syntax Highlighting (installed into the ZSH_CUSTOM plugins dir), pinned to a release.
# To upgrade, bump the tag; no refreshPeriod because a pinned archive never changes.
[".config/oh-my-zsh/plugins/zsh-syntax-highlighting"]
    type = "archive"
    url = "https://github.com/zsh-users/zsh-syntax-highlighting/archive/refs/tags/0.8.0.tar.gz"
    exact = true
    stripComponents = 1
