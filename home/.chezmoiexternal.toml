# oh-my-zsh itself (required by .zshrc); custom content lives in
# ~/.config/oh-my-zsh (see ZSH_CUSTOM in .zshrc), so this stays a pure mirror
[".oh-my-zsh"]
    type = "archive"
    url = "https://github.com/ohmyzsh/ohmyzsh/archive/master.tar.gz"
    exact = true
    stripComponents = 1
    refreshPeriod = "168h"

# ZSH Syntax Highlighting (installed into the ZSH_CUSTOM plugins dir)
[".config/oh-my-zsh/plugins/zsh-syntax-highlighting"]
    type = "archive"
    url = "https://github.com/zsh-users/zsh-syntax-highlighting/archive/master.tar.gz"
    exact = true
    stripComponents = 1
    refreshPeriod = "168h"
